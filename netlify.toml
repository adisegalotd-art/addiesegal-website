[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "lts/*"

# The static export emits a real 404.html. A SPA-style catch-all rewrite to
# /index.html with a 200 served the homepage for every unknown URL, which Google
# reports as a soft 404, so unknown paths now get 404.html with a real 404 status.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
